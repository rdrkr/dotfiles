# Global mise tools, kept current by `ua` (mise install + mise upgrade).
#
# Pre-releases: add `prerelease = true` to a tool to let `latest` resolve to its newest release
# across stable and pre-releases (github, forgejo, aqua and dotnet backends). To opt every tool in,
# set `prereleases = true` under [settings] instead.

[tools]
# Remux media server CLI (https://github.com/lostb1t/remux): not in Homebrew, binaries only ship as
# GitHub release assets. There is no Windows CLI build.
# Official releases only. This flag drives Remux.app as well: update-remux-app.sh reads it and
# installs the tagged DMG rather than the rolling `nightly` one. Adding `prerelease = true` back
# puts both on the nightly channel again, and nothing else has to change.
"github:lostb1t/remux" = { version = "latest", os = ["macos", "linux"] }
