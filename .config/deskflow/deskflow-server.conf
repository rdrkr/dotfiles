# Deskflow server config for the Dell (server) + MacBook (client) pair.
#
# Loaded through Deskflow's "Use external config file" setting
# (Deskflow.conf: [server] externalConfig=true, externalConfigFile=<this file>)
# instead of the GUI's generated config, because the GUI writes the Win key as
# `Meta`, which Deskflow's Windows server cannot register as a hotkey; it must
# be `Super`. With an external config the GUI's screen-layout editor is
# ignored, so layout changes go in the `links` section below.

# Single focus indicator: komorebi (Dell) and JankyBorders (Mac) hide their
# focused-window border while Deskflow input is on the other machine. Watchers
# tail Deskflow's own log for the switch, so file logging must be on:
#   Dell: Deskflow.conf [log] toFile=true,
#         file=<%LOCALAPPDATA% spelled out>/Deskflow/deskflow.log
#         (watcher: .config/komorebi/deskflow-focus-borders.ps1)
#   Mac:  Deskflow GUI -> Settings -> "Log to file",
#         ~/Library/Logs/Deskflow/deskflow.log
#         (watcher: .config/borders/deskflow-focus-borders.sh)

# The computers themselves (the Dell as server, the MacBook as client) are not
# listed here: Deskflow 1.27 takes them from Deskflow.conf and ignores a
# `screens` section with a warning.

# Layout: the MacBook sits to the right of the Dell.
section: links
	eu-poc-6z3ygk4:
		left = rdrkr-mbp-m1
	rdrkr-mbp-m1:
		right = eu-poc-6z3ygk4
end

# Ctrl+Alt+Win+Left/Right jumps the keyboard and mouse to the machine on that
# side: a "bigger" Ctrl+Left/Right, which moves focus within one machine
# (komorebi on the Dell, AeroSpace on the Mac). The komorebi AHK script leaves
# this chord unbound so it reaches Deskflow.
section: options
	keystroke(Control+Alt+Super+Left) = switchInDirection(left)
	keystroke(Control+Alt+Super+Right) = switchInDirection(right)
end
