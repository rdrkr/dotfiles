# Decypharr's WebDAV export, served by the DUMB container on loopback (published in
# ~/Development/repos/DUMB/compose.yaml as 127.0.0.1:8282).
#
# This exists because macOS's native WebDAV client (mount_webdav/webdavfs) cannot read
# from Decypharr: directory listings work, but opening any file fails with a spurious
# ENFILE ("Too many open files in system") even with kern.maxfiles at 524288 and the
# system nowhere near its limit. rclone's WebDAV client has no such problem.
#
# Mounted by ~/Library/LaunchAgents/net.ts.dumb.decypharr-mount.plist.
[decypharr-torbox]
type = webdav
url = http://127.0.0.1:8282/webdav/torbox
vendor = other
