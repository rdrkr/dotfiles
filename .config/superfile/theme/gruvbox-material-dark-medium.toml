##############################################
#                                            #
#   Gruvbox Material Dark (Medium) Theme     #
#                                            #
##############################################

# Palette: https://github.com/sainnhe/gruvbox-material (dark, medium background,
# "material" foreground) - the same colors as the yazi gruvbox-material flavor.

# This contains the theme config file for superfile! For more details see:
# https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "gruvbox"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#d4be98"
full_screen_bg = "#282828"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#a9b665", "#ea6962"]
directory_icon_color = ""

#-- File Panel
file_panel_fg = "#d4be98"
file_panel_bg = "#282828"
file_panel_border = "#7c6f64"
file_panel_border_active = "#d8a657"
file_panel_top_directory_icon = "#a9b665"
file_panel_top_path = "#7daea3"
file_panel_item_selected_fg = "#89b482"
file_panel_item_selected_bg = "#3c3836"

#-- Footer
footer_fg = "#d4be98"
footer_bg = "#282828"
footer_border = "#7c6f64"
footer_border_active = "#d8a657"

#-- Sidebar
sidebar_fg = "#d4be98"
sidebar_bg = "#282828"
sidebar_title = "#d3869b"
sidebar_border = "#282828"
sidebar_border_active = "#d8a657"
sidebar_item_selected_fg = "#e78a4e"
sidebar_item_selected_bg = "#3c3836"
sidebar_divider = "#7c6f64"

#-- Modals
modal_fg = "#d4be98"
modal_bg = "#32302f"
modal_border_active = "#7c6f64"
modal_cancel_fg = "#ddc7a1"
modal_cancel_bg = "#45403d"
modal_confirm_fg = "#282828"
modal_confirm_bg = "#d8a657"

#-- Help Menu
help_menu_hotkey = "#a9b665"
help_menu_title = "#e78a4e"

#-- Special
cursor = "#a9b665"
correct = "#a9b665"
error = "#ea6962"
hint = "#7daea3"
cancel = "#928374"
