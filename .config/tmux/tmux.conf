# Global Settings
set -g mouse on

set -g default-terminal "tmux-256color"
set -asg terminal-overrides ',xterm-256color:RGB'
set -asg terminal-overrides ',*:Sync'
set -sg escape-time 0            # zero-out escape time delay

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy on      # exit from tmux when closing a session
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi

# Key Bindings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Catppuccin Plugin Settings
## Gruvbox Dark colors
### Background and Foreground
set -ogq @thm_bg "#282828"        # Gruvbox dark background
set -ogq @thm_fg "#ebdbb2"        # Gruvbox light foreground

### Primary Colors (using bright/strong variants)
set -ogq @thm_rosewater "#d3869b" # Gruvbox purple (bright)
set -ogq @thm_flamingo "#fe8019"  # Gruvbox orange (bright)
set -ogq @thm_pink "#d3869b"      # Gruvbox purple (bright)
set -ogq @thm_mauve "#d3869b"     # Gruvbox purple (bright)
set -ogq @thm_red "#fb4934"       # Gruvbox red (bright)
set -ogq @thm_maroon "#cc241d"    # Gruvbox red (muted)
set -ogq @thm_peach "#fe8019"     # Gruvbox orange (bright)
set -ogq @thm_yellow "#fabd2f"    # Gruvbox yellow (bright)
set -ogq @thm_green "#b8bb26"     # Gruvbox green (bright)
set -ogq @thm_teal "#8ec07c"      # Gruvbox aqua (bright)
set -ogq @thm_sky "#83a598"       # Gruvbox blue (bright)
set -ogq @thm_sapphire "#458588"  # Gruvbox blue (muted)
set -ogq @thm_blue "#83a598"      # Gruvbox blue (bright)
set -ogq @thm_lavender "#d3869b"  # Gruvbox purple (bright)

### Surfaces and overlays (using background gradations)
set -ogq @thm_subtext_1 "#bdae93" # Gruvbox fg3
set -ogq @thm_subtext_0 "#d5c4a1" # Gruvbox fg2
set -ogq @thm_overlay_2 "#a89984" # Gruvbox fg4
set -ogq @thm_overlay_1 "#928374" # Gruvbox gray
set -ogq @thm_overlay_0 "#7c6f64" # Gruvbox bg4
set -ogq @thm_surface_2 "#665c54" # Gruvbox bg3
set -ogq @thm_surface_1 "#504945" # Gruvbox bg2
set -ogq @thm_surface_0 "#3c3836" # Gruvbox bg1
set -ogq @thm_mantle "#32302f"    # Gruvbox bg0_s (soft)
set -ogq @thm_crust "#1d2021"     # Gruvbox bg0_h (hard)

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_2}"
set -g @catppuccin_directory_text " #(echo '#{pane_current_path}' | sed 's#$HOME#~#g' | rev | cut -d'/' -f1-2 | rev)"
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_directory_color "#{E:@thm_flamingo}"
set -g @catppuccin_status_background "#{E:@thm_bg}"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_user_text " rdrkr"

## Load catppuccin
run '~/.config/tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

## Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 200
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#{E:@catppuccin_status_user}"
set -ag status-left "#{E:@catppuccin_status_directory}"
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Load TPM (Tmux Plugin Manager)
run '~/.config/tmux/plugins/tpm/tpm'

# Add empty line as margin (must come after tpm)
#set -g status 2
#set -g status-format[1] ''

