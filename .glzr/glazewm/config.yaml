general:
  # Commands to run when the WM has started.
  startup_commands:
    - 'shell-exec borders active_color=0xffebdbb2 inactive_color=0x00000000
      width=5.0 style=round hidpi=on blacklist="iPhone Mirroring"'

  shutdown_commands: []

  config_reload_commands: []

  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '4px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#ebdbb2'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: false
      color: '#000000'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: {equals: 'zebar'}
      - window_title: {regex: '[Pp]icture.in.[Pp]icture'}
        window_class: {regex: 'Chrome_WidgetWin_1|MozillaDialogClass'}

  # Safari -> 1
  - commands: ['move --workspace 1']
    match:
      - window_process: {regex: '(?i)safari'}

  # Warp -> 2
  - commands: ['move --workspace 2']
    match:
      - window_process: {regex: '(?i)warp'}

  # IntelliJ, Xcode -> 3
  - commands: ['move --workspace 3']
    match:
      - window_process: {regex: '(?i)intellij|idea|xcode'}

  # Chrome -> 4
  - commands: ['move --workspace 4']
    match:
      - window_process: {regex: '(?i)chrome'}

  # Messages, WhatsApp, Beeper -> 5
  - commands: ['move --workspace 5']
    match:
      - window_process: {regex: '(?i)messages|whatsapp|beeper'}

  # Mail messages -> tiling, workspace 5
  - commands: ['toggle-tiling', 'move --workspace 5']
    match:
      - window_process: {regex: '(?i)mail'}
        window_title: {regex: '(?i)messages'}

  # Floating apps
  - commands: ['toggle-floating']
    match:
      - window_process:
          {
            regex: '(?i)mail|contacts|phone|facetime|quicktime|finder|ollama|calendar|activity|gpt|chatgpt|preview|photos|podcasts|perplexity|store|java|passwords|pearcleaner|reminders|sf
              symbols|teamviewer',
          }

binding_modes:
  - name: 'service'
    keybindings:
      - commands: ['wm-reload-config', 'wm-disable-binding-mode --name service']
        bindings: ['escape']
      - commands: ['wm-toggle-pause', 'wm-disable-binding-mode --name service']
        bindings: ['e']
      - commands: ['wm-disable-binding-mode --name service']
        bindings: ['r']
      - commands: ['wm-disable-binding-mode --name service']
        bindings: ['backspace']
      # Volume commands
      - commands:
          [
            'shell-exec osascript -e "set volume output volume (output volume
              of (get volume settings) - 5)"',
          ]
        bindings: ['down']
      - commands:
          [
            'shell-exec osascript -e "set volume output volume (output volume
              of (get volume settings) + 5)"',
          ]
        bindings: ['up']
      - commands:
          [
            'shell-exec osascript -e "set volume output volume 0"',
            'wm-disable-binding-mode --name service',
          ]
        bindings: ['shift+down']

keybindings:
  # Focus
  - commands: ['focus --direction left']
    bindings: ['ctrl+left']
  - commands: ['focus --direction down']
    bindings: ['ctrl+down']
  - commands: ['focus --direction up']
    bindings: ['ctrl+up']
  - commands: ['focus --direction right']
    bindings: ['ctrl+right']

  # Workspaces
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']

  # Next/Prev workspace
  - commands: ['focus --next-active-workspace']
    bindings: ['ctrl+alt+right']
  - commands: ['focus --prev-active-workspace']
    bindings: ['ctrl+alt+left']

  # Join-with
  - commands: ['set-tiling-direction vertical', 'move --direction left']
    bindings: ['ctrl+alt+shift+left']
  - commands: ['set-tiling-direction vertical', 'move --direction right']
    bindings: ['ctrl+alt+shift+right']
  - commands: ['set-tiling-direction horizontal', 'move --direction up']
    bindings: ['ctrl+alt+shift+up']
  - commands: ['set-tiling-direction horizontal', 'move --direction down']
    bindings: ['ctrl+alt+shift+down']

  # Move
  - commands: ['move --direction left']
    bindings: ['ctrl+shift+left']
  - commands: ['move --direction down']
    bindings: ['ctrl+shift+down']
  - commands: ['move --direction up']
    bindings: ['ctrl+shift+up']
  - commands: ['move --direction right']
    bindings: ['ctrl+shift+right']

  - commands: ['move --workspace 1']
    bindings: ['ctrl+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['ctrl+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['ctrl+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['ctrl+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['ctrl+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['ctrl+shift+6']

  # Resize
  - commands: ['resize --width -5%']
    bindings: ['ctrl+oem_minus']
  - commands: ['resize --width +5%']
    bindings: ['ctrl+oem_plus']

  # Layout
  - commands: ['toggle-floating']
    bindings: ['alt+oem_question']
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+oem_comma']

  # Service mode
  - commands: ['wm-enable-binding-mode --name service']
    bindings: ['alt+shift+oem_semicolon']

  # Close focused window.
  - commands: ['close']
    bindings: ['alt+shift+q']

  # Kill GlazeWM process safely.
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
