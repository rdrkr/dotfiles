# =============================================================================
# psmux configuration (native Windows / PowerShell)
# =============================================================================
#
# Why this file exists
# --------------------
# psmux reads ~/.psmux.conf before it falls back to ~/.config/tmux/tmux.conf.
# It has to be a separate file because tmux.conf is built around TPM and the
# catppuccin/tmux plugin, and neither can run here:
#
#   * TPM (tpm/bin/install_plugins) and catppuccin.tmux are POSIX shell
#     scripts. psmux `run-shell` executes through cmd.exe, so they never run.
#   * With the plugin unloaded, every @catppuccin_* option stays undefined and
#     psmux renders the *literal* option name into the status bar - which is
#     the "@catppuccin_window_current_left_separator" garbage on the bar.
#   * `#(free -m ...)` / `#(memory_pressure ...)` are Unix commands.
#
# So the theme below is the catppuccin/tmux status line *pre-resolved*: the
# exact strings tmux 3.6 produces on WSL with the gruvbox palette from
# .config/tmux/tmux.conf, written out as plain option lines. No plugin needed
# for the theme itself, which also means it is painted on the first frame.
#
# CPU/RAM come from psmux-cpu (the psmux port of tmux-cpu) via ppm, installed
# by scripts/install-psmux-plugins.ps1.
#
# Keep in sync with: .config/tmux/tmux.conf
# =============================================================================

# -----------------------------------------------------------------------------
# Core behaviour (mirrors .config/tmux/tmux.conf)
# -----------------------------------------------------------------------------
set -g prefix C-a

set -g mouse on
set -sg escape-time 0
set -g allow-rename off

## Silence the bell entirely. tmux.conf uses `bell-action any`, which is fine on
## a Linux terminal that ignores BEL, but on Windows it reaches the console and
## beeps audibly. Windows Terminal's own `bellStyle` is already "none"; this
## stops psmux forwarding the bell in the first place.
set -g bell-action none
set -g visual-bell off

set -g base-index 1
set -g history-limit 5000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi

set -g set-titles on
set -g set-titles-string "#S: #W"

## Opaque block cursor. psmux ships `bar`, which draws a thin vertical sliver
## the shell's own cursor is easy to lose against; `block` fills the whole cell.
## Accepted values are block, underline and bar - psmux does not validate this
## option, so a typo is stored verbatim and silently leaves the cursor as-is.
##
## Blinking is deliberately left alone (psmux defaults it off, but PSMUX_CURSOR_BLINK
## and the running server can both override); add `set -g cursor-blink off` here
## if the block should stay solid rather than pulse.
set -g cursor-style block

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------
bind-key -T copy-mode-vi 'v' send -X begin-selection

## No `bind -n C-Tab` / `C-BTab` here, unlike tmux.conf. They are redundant now
## that Windows Terminal intercepts those chords itself (below), and a root-table
## binding on C-Tab is a hazard: Ctrl+I and Tab are both byte 0x09, so a psmux
## key parser that folds the two would swallow every Tab before the shell sees
## it and take PowerShell's tab-completion with it.

## Window navigation: Ctrl+Tab and Win+Alt+Left/Right.
##
## tmux.conf does this with `set -s user-keys[N]` plus `bind -n User0/User1`.
## That does not port: psmux stores user-keys[N] but never dispatches them - the
## User0/User1 bindings are silently absent from `list-keys` while every other
## binding in this file registers - so nothing would ever fire.
##
## The switching is therefore driven from the terminal instead. Windows Terminal
## sends the prefix sequence for these chords (see the sendInput actions in
## .config/windows-terminal/settings.json), which lands on the default `prefix n`
## / `prefix p` bindings below. Win+Alt+Left/Right arrive as Ctrl+Shift+Tab /
## Ctrl+Tab, remapped by .config/komorebi/komorebic-hotkeys.ahk. Using the prefix
## table rather than a bespoke escape sequence means the very same Windows
## Terminal binding also drives tmux under WSL, which shares the C-a prefix.
bind -T prefix n next-window
bind -T prefix p previous-window

## Alt+Backspace (delete the previous word) has to be forwarded by hand.
##
## psmux does recognise the chord - a root-table binding on M-BSpace fires for it -
## but its own handling of the key drops the modifier and writes a bare DEL to the
## pane, so PSReadLine sees a plain Backspace and eats a single character instead
## of a word. Alt survives on every other key tested (Alt+b, Alt+Delete), which is
## why only this one chord needs the detour.
##
## Sending the bytes back out verbatim is what fixes it: ESC DEL is the sequence a
## terminal emits for the chord, ConPTY turns it back into an Alt+Backspace key
## event on the way into the pane, and profile.ps1 binds that to BackwardKillWord
## (the same thing \e^? does for zsh under WSL).
##
## `send-keys M-BSpace` cannot be used here - psmux's key-name parser only takes a
## single character after M-, so it resolves to Alt+Shift+B - hence the raw -H
## form. Only the ESC DEL spelling is bindable; ESC 0x08 matches no key name and
## still reaches the pane as a bare Backspace.
bind -n M-BSpace send-keys -H 1b 7f

# -----------------------------------------------------------------------------
# Gruvbox palette
# -----------------------------------------------------------------------------
# Same values as the @thm_* block in .config/tmux/tmux.conf. Kept as options so
# the intent of each colour stays documented; the status strings below spell the
# hex out literally, because psmux does not expand @options everywhere tmux does.
set -gq @thm_bg        "#282828"  # Gruvbox bg0
set -gq @thm_fg        "#ebdbb2"  # Gruvbox fg
set -gq @thm_crust     "#1d2021"  # Gruvbox bg0_h
set -gq @thm_red       "#fb4934"  # session module while the prefix is held
set -gq @thm_surface_0 "#3c3836"  # Gruvbox bg1
set -gq @thm_overlay_2 "#a89984"  # Gruvbox fg4
set -gq @thm_green     "#b8bb26"  # session module
set -gq @thm_blue      "#83a598"  # user module
set -gq @thm_peach     "#fe8019"  # directory module
set -gq @thm_yellow    "#fabd2f"  # RAM module
set -gq @thm_sapphire  "#458588"  # CPU module
set -gq @thm_rosewater "#d3869b"  # current window
set -gq @thm_lavender  "#d3869b"  # activity

# -----------------------------------------------------------------------------
# Plugins (ppm - the psmux equivalent of TPM)
# -----------------------------------------------------------------------------
# Installed by scripts/install-psmux-plugins.ps1.
#
# psmux-cpu polls Win32_Processor / Win32_OperatingSystem on the status-interval
# hook and publishes @cpu_percentage and @ram_percentage. It also sets
# status-interval to 5, which is why that option is not set here.
#
# This block sits ABOVE the status bar for the same reason tmux.conf keeps its
# overrides below tpm: psmux sources a plugin's plugin.conf synchronously, at
# the line that declares the plugin, and psmux-cpu's plugin.conf installs a
# status-right of its own. Declaring plugins first lets the status bar below win.
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-cpu'

## ppm is the one plugin psmux does not auto-source from its @plugin line, so
## its bindings are pulled in by hand. Sourcing plugin.conf rather than running
## ppm.ps1 keeps server start synchronous and free of a PowerShell spawn: the
## .ps1 entry point only re-sources plugins, and it skips any that ship a
## plugin.conf - which both of these do.
##
##   Prefix + I  install declared plugins   Prefix + U  update
##   Prefix + M  remove unused plugins      Prefix + C-c  refresh CPU/RAM now
source-file '~/.psmux/plugins/ppm/plugin.conf'

## psmux-cpu's poll is replaced here, and has to be unset rather than avoided:
## its plugin.conf hangs `run-shell "pwsh -File system_stats.ps1"` off both
## client-attached and status-interval, so the server starts a PowerShell on
## every status-bar tick. psmux runs run-shell synchronously, which makes that a
## redraw stall of however long pwsh takes to start, five seconds apart, in every
## server - and on most of them the spawn does not merely stall, it never
## succeeds at all, leaving the meters frozen on the first sample and the message
## line repeating:
##
##   run-shell: pwsh -NoProfile -File "...\system_stats.ps1":
##   The handle is invalid. (os error 6)
##
## ERROR_INVALID_HANDLE is CreateProcess refusing to inherit the standard handles
## of a server with no console of its own, which is the normal state for a psmux
## server in the background. The spawn is what fails, so the script cannot defend
## itself; the only fix available from outside the psmux binary is to stop asking
## the server to spawn on a timer.
##
## scripts/psmux-stats-daemon.ps1 does the polling instead, from one long-lived
## process per server. It is started by profile.ps1 rather than by a run-shell
## here, because a run-shell in this file is still the server spawning a process
## and would fail on exactly the servers that need it; the first pane shell of a
## server is an ordinary process with a console and can spawn perfectly well.
##
## status-interval stays at the 5 the plugin set - it now only paces the redraw.
set-hook -u client-attached
set-hook -u status-interval

# -----------------------------------------------------------------------------
# Status bar (overrides - must come after the plugin block)
# -----------------------------------------------------------------------------
## A row count of 2 reserves a second, empty status row - the blank margin line
## tmux.conf gets from `set -g status 2` plus `status-format[1] ''`. psmux stores
## the count (confirmed: the window loses a row) but has no settable
## status-format[N] array, so the extra row just renders empty. Which is the
## whole point here, so nothing else is needed.
set -g status 2
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=#282828,fg=#ebdbb2"

## Module shape, identical to catppuccin "rounded" with status_fill "icon":
##   <left half circle in the accent colour>
##   <nerd-font icon, crust on accent>
##   <text, fg on surface_0>
##   <right half circle in surface_0>
##
## Session / user / directory. The session module's accent flips from green to
## red while the prefix is held, the same `#{?client_prefix,...}` test catppuccin
## uses - psmux evaluates formats inside a #[...] style spec, so it ports as-is.
##
## The directory module shows the basename of the pane's cwd; when that basename
## is the username we are in $HOME and show "~", matching the sed/rev/cut
## pipeline the tmux config uses.
set -g status-left "#[fg=#{?client_prefix,#fb4934,#b8bb26},bg=#282828]#[fg=#1d2021,bg=#{?client_prefix,#fb4934,#b8bb26}] #[fg=#ebdbb2,bg=#3c3836] #S#[fg=#3c3836,bg=#282828] #[fg=#83a598,bg=#282828]#[fg=#1d2021,bg=#83a598] #[fg=#ebdbb2,bg=#3c3836] rdrkr#[fg=#3c3836,bg=#282828] #[fg=#fe8019,bg=#282828]#[fg=#1d2021,bg=#fe8019] #[fg=#ebdbb2,bg=#3c3836] #{?#{==:#{b:pane_current_path},#{user}},~,#{b:pane_current_path}}#[fg=#3c3836,bg=#282828] "

## RAM / CPU. Values are published as options by psmux-cpu. Seed them only if
## the plugin never loaded, so a missing install shows "--" rather than the raw
## option name; when it is installed its plugin.conf has already seeded them
## with its own placeholder and -o leaves that alone.
set -og @ram_percentage "--"
set -og @cpu_percentage "--"
set -g status-right "#[fg=#fabd2f,bg=#282828]#[fg=#1d2021,bg=#fabd2f]󱀙 #[fg=#ebdbb2,bg=#3c3836] #{@ram_percentage}#[fg=#3c3836,bg=#282828] #[fg=#458588,bg=#282828]#[fg=#1d2021,bg=#458588] #[fg=#ebdbb2,bg=#3c3836] #{@cpu_percentage}#[fg=#3c3836,bg=#282828]"

## Window tabs: number pill on surface_0, name pill on overlay_2 (inactive) or
## rosewater (active). The `reverse`/`none` attribute pair tmux emits is written
## out as explicit fg/bg here, since psmux's renderer is stricter about it.
set -g window-status-separator " "
set -g window-status-format "#[fg=#3c3836,bg=#282828]#[fg=#ebdbb2,bg=#3c3836]#I #[fg=#1d2021,bg=#a89984] #W#[fg=#a89984,bg=#282828]"
set -g window-status-current-format "#[fg=#3c3836,bg=#282828]#[fg=#ebdbb2,bg=#3c3836]#I #[fg=#1d2021,bg=#d3869b] #W#{?window_zoomed_flag,(),}#[fg=#d3869b,bg=#282828]"
set -g window-status-activity-style "bg=#d3869b,fg=#1d2021"
set -g window-status-bell-style "bg=#fabd2f,fg=#1d2021"

# -----------------------------------------------------------------------------
# Panes and messages
# -----------------------------------------------------------------------------
set -g pane-active-border-style "fg=#d3869b,bg=default"
set -g pane-border-style "fg=#665c54,bg=default"
set -g message-style "fg=#8ec07c,bg=#282828"
set -g message-command-style "fg=#8ec07c,bg=#282828"
set -g mode-style "fg=#1d2021,bg=#fabd2f"
