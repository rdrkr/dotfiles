#
# Groups run in parallel within a stage; a stage starts once every group of the previous stage is
# done. Package managers that replace other tools' binaries (winget, scoop) run in stage 0 so those
# tools never update themselves while being replaced.

name: update-windows
description: Update all system tools and packages on Windows
usage: ua [options]

groups:
  - title: Updating winget packages
    stage: 0
    tasks:
      - title: Upgrading winget packages
        command: powershell
        args:
          [
            -NoProfile,
            -Command,
            "winget upgrade --all --include-unknown --accept-package-agreements --accept-source-agreements",
          ]
        verbose: true

  - title: Updating scoop packages
    stage: 0
    tasks:
      - title: Updating scoop
        command: powershell
        args: [-NoProfile, -Command, "scoop update"]
        verbose: true
      - title: Upgrading scoop packages
        command: powershell
        args: [-NoProfile, -Command, "scoop update *"]

  - title: Updating global npm packages
    stage: 1
    tasks:
      - title: Upgrading global npm packages
        command: powershell
        args:
          [
            -NoProfile,
            -Command,
            "$pkgs = Get-Content ~/dotfiles/.config/npm-global-packages.txt | Select-String -Pattern '^\\s*(#|$)' -NotMatch | Select-Object -ExpandProperty Line; if ($pkgs) { npm install -g $pkgs --dangerously-allow-all-scripts }",
          ]
        verbose: true

  - title: Updating pipx packages
    stage: 1
    tasks:
      - title: Upgrading pipx packages
        command: powershell
        args: [-NoProfile, -Command, "pipx upgrade-all"]

  - title: Updating bun
    stage: 1
    tasks:
      - title: Upgrading bun
        command: powershell
        args: [-NoProfile, -Command, "bun upgrade"]

  - title: Updating LazyVim
    stage: 1
    tasks:
      # Lazy! sync installs, cleans and updates plugins
      - title: Syncing LazyVim
        command: powershell
        args: [-NoProfile, -Command, "nvim --headless '+Lazy! sync' +qa"]
      - title: Updating Mason
        command: powershell
        args: [-NoProfile, -Command, "nvim --headless +MasonUpdateAll +qa"]
      - title: Updating Treesitter
        command: powershell
        args: [-NoProfile, -Command, "nvim --headless +TSUpdate +qa"]

  - title: Updating pre-commit
    stage: 1
    tasks:
      - title: Upgrading pre-commit hooks
        command: powershell
        args: [-NoProfile, -Command, "pre-commit autoupdate"]
        cwd: ~/dotfiles
