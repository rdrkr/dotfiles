name: update-all
description: Update all system tools and packages
usage: ua [options]

groups:
  - title: Updating Homebrew
    tasks:
      - title: Updating Homebrew
        command: brew
        args: [update]
      - title: Upgrading Homebrew packages
        command: brew
        args: [upgrade]
      - title: Upgrading App Store apps
        command: mas
        args: [upgrade]
      - title: Cleaning up Homebrew
        command: brew
        args: [cleanup, "--prune=all"]

  - title: Updating global npm packages
    tasks:
      - title: Upgrading global npm packages
        command: npm
        args: [upgrade, "--global"]

  - title: Updating pipx packages
    tasks:
      - title: Upgrading pipx packages
        command: pipx
        args: [upgrade-all]

  - title: Updating zinit
    tasks:
      - title: Updating zinit
        command: zsh
        args:
          [
            -l,
            -c,
            'source "${ZINIT_HOME:-~/.local/share/zinit/zinit.git}/zinit.zsh" && zinit self-update',
          ]
      - title: Updating zinit plugins
        command: zsh
        args:
          [
            -l,
            -c,
            'source "${ZINIT_HOME:-~/.local/share/zinit/zinit.git}/zinit.zsh" && zinit update --quiet --all',
          ]
      - title: Clearing zinit cache
        command: zsh
        args:
          [
            -l,
            -c,
            'source "${ZINIT_HOME:-~/.local/share/zinit/zinit.git}/zinit.zsh" && zinit cclear',
          ]

  - title: Updating LazyVim
    tasks:
      - title: Syncing LazyVim
        command: nvim
        args: [--headless, "+Lazy! sync", +qa]
      - title: Updating LazyVim
        command: nvim
        args: [--headless, "+Lazy! update", +qa]
      - title: Updating Mason
        command: nvim
        args: [--headless, +MasonUpdate, +qa]
      - title: Updating Treesitter
        command: nvim
        args: [--headless, +TSUpdate, +qa]

  - title: Updating pre-commit
    tasks:
      - title: Upgrading pre-commit hooks
        command: pre-commit
        args: [autoupdate]
        cwd: ~/dotfiles
